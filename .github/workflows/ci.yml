name: CI

on:
  push:
    branches: [master]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Accept Android SDK licences (the runner image ships the SDK)
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      - uses: gradle/actions/setup-gradle@v4

      - name: Verify architecture
        run: bash tools/verify_architecture.sh

      - name: Proof checker self-tests
        run: |
          python3 -m unittest discover -s tools/proof -p 'test_*.py' -v

      - name: Unit tests
        run: ./gradlew test --continue --stacktrace

      - name: Assemble debug APK
        run: ./gradlew assembleDebug --stacktrace

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-reports
          path: "**/build/reports/tests/"
          if-no-files-found: ignore

      - uses: actions/upload-artifact@v4
        with:
          name: raphael-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
